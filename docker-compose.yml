services:
  productiv:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env.runtime}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in .env.runtime}
    container_name: productiv
    restart: unless-stopped
    ports:
      - "8788:8788"
    env_file:
      - .env.runtime
    volumes:
      - productiv-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  productiv-data:
